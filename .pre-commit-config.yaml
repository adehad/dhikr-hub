---
ci:
  # pre-commit.ci runners have no npm; the Live worker checks workflow runs the typecheck.
  skip: [tsc]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: fix-byte-order-marker
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-vcs-permalinks
      - id: check-yaml
        files: .*\.(yaml|yml)$
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: codespell
        description: Checks for common misspellings in text files.
        entry: codespell
        language: python
        types_or: [text, json, markdown]
        args: ["-L", "murr"]
        exclude: ^(site/static/favicon\.svg|package-lock\.json)$
        require_serial: false
  - repo: local
    hooks:
      - id: format-qasida-json
        name: format qasida JSON
        entry: python scripts/format_qasida_json.py
        language: python
        files: ^site/data/qasida/.*\.json$
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-metaschema
        files: ^qasida\.schema\.json$
      - id: check-jsonschema
        name: check qasida data against qasida.schema.json
        files: ^site/data/qasida/.*\.json$
        args: [--schemafile, qasida.schema.json]
  - repo: https://github.com/adehad/pre-commit-hooks
    rev: b581e6c14a9fbd9c6d37452761b525be6737b97b
    hooks:
      - id: arabic-presentation-form
        entry: arabic-presentation-form
        language: python
        types_or: [text, json, markdown]
        args: [--excluded-chars, (ﷺ)]
        files: ^site/data/
  - repo: local
    hooks:
      - id: tsc
        name: tsc typecheck
        entry: npm run typecheck
        language: system
        pass_filenames: false
        files: (\.ts$|tsconfig.*\.json$|^package\.json$)
